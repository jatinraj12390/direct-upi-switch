spring.application.name=upi-backend
server.port=8080

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:upidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Console for inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Default Merchant settings (Fallback if not provided in request)
upi.default.merchant-vpa=testmerchant@okaxis
upi.default.merchant-name=DirectUPI Store
